<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Saisie du temps</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --accent: #1a73e8;
    --accent-dark: #1557b0;
    --bg: #ffffff;
    --border: #d9d9d9;
    --muted: #66707a;
    --text: #1c2430;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 12px 14px;
    gap: 10px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  h1 { font-size: 16px; margin: 0; }
  .jour-nav { display: flex; align-items: center; gap: 6px; }
  .jour-nav input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font: inherit;
  }
  .total-jour { font-weight: bold; color: var(--accent); white-space: nowrap; }
  .nav-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    padding: 2px 8px;
    font: inherit;
  }
  .nav-btn:hover { background: #f2f6fc; }
  .banner {
    background: #fff3cd;
    border: 1px solid #ffe08a;
    color: #7a5c00;
    border-radius: 6px;
    padding: 8px 10px;
  }
  form {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  form .row { display: flex; flex-wrap: wrap; gap: 10px; }
  label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  label.grow { flex: 1; min-width: 160px; }
  .aide-ligne { display: flex; align-items: center; gap: 6px; width: 100%; }
  .aide {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--border);
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    line-height: 1;
    cursor: help;
    position: relative;
    user-select: none;
    flex: none;
  }
  .aide:hover, .aide:focus { background: var(--accent); outline: none; }
  .aide::after {
    content: attr(data-tip);
    display: none;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 20px;
    width: 220px;
    background: #2b2f36;
    color: #fff;
    font-size: 12px;
    font-weight: normal;
    line-height: 1.4;
    padding: 8px 10px;
    border-radius: 6px;
    text-align: left;
    white-space: pre-line;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    cursor: default;
  }
  .aide:hover::after, .aide:focus::after { display: block; }
  input {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    font: inherit;
    color: var(--text);
    background: #fff;
  }
  input:focus { outline: 2px solid #b9d2f5; border-color: var(--accent); }
  select {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    font: inherit;
    color: var(--text);
    background: #fff;
    width: 100%;
  }
  select:focus { outline: 2px solid #b9d2f5; border-color: var(--accent); }
  #heures { width: 86px; }
  button[type="submit"] {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 18px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  button[type="submit"]:hover { background: var(--accent-dark); }
  button[type="submit"]:disabled { opacity: .55; cursor: default; }
  section h2 { font-size: 13px; color: var(--muted); margin: 4px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  #resume { display: none; }
  #resume.visible { display: block; }
  .repartition { display: flex; flex-direction: column; gap: 4px; }
  .barre-ligne { display: flex; align-items: center; gap: 8px; }
  .barre-nom { width: 34%; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barre-fond { flex: 1; background: #eef1f4; border-radius: 4px; height: 14px; overflow: hidden; }
  .barre-valeur { width: 52px; color: var(--muted); }
  .barre { height: 100%; background: var(--accent); }
  #liste { flex: 1; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eceff1; }
  th { font-size: 12px; color: var(--muted); font-weight: normal; }
  td.heures, th.heures { text-align: right; }
  td .btn-suppr {
    border: none;
    background: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  td .btn-suppr:hover { background: #fdecea; }
  .vide { color: var(--muted); padding: 14px 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>⏱ Saisie du temps</h1>
    <div class="jour-nav">
      <button class="nav-btn" id="jourPrecedent" title="Jour précédent">‹</button>
      <input type="date" id="jourAffiche" />
      <button class="nav-btn" id="jourSuivant" title="Jour suivant">›</button>
      <span class="total-jour" id="totalJour"></span>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <form id="form">
    <div class="row">
      <label>Date
        <input type="date" id="date" required />
      </label>
      <label class="grow">Projet
        <input type="text" id="projet" list="projets" required placeholder="Nom du projet" />
        <select id="projetRef" style="display:none"></select>
        <datalist id="projets"></datalist>
      </label>
      <label>Durée
        <span class="aide-ligne">
          <span class="aide" tabindex="0" aria-label="Aide : heures"
            data-tip="Vous pouvez aussi taper une durée : 1h45, 1:45 ou 45 min.&#160;&#10;La valeur enregistrée dans Grist reste en centièmes (1,75).">?</span>
          <input type="text" id="heures" required inputmode="decimal" placeholder="1h15" title="Heures en centièmes — ex. 1,75 = 1 h 45. Accepte aussi 1h45 ou 1:45." />
        </span>
      </label>
    </div>
    <div class="row">
      <label class="grow" id="labelActivite">Activité
        <input type="text" id="activite" list="activites" placeholder="Optionnel" />
        <select id="activiteRef" style="display:none"></select>
        <datalist id="activites"></datalist>
      </label>
      <label class="grow" id="labelAgent">Agent
        <input type="text" id="agent" list="agents" placeholder="Optionnel" />
        <select id="agentRef" style="display:none"></select>
        <datalist id="agents"></datalist>
      </label>
      <label class="grow">Commentaire
        <input type="text" id="commentaire" placeholder="Optionnel" />
      </label>
      <button type="submit" id="btnAjouter">Ajouter</button>
    </div>
  </form>

  <section id="resume">
    <h2>Répartition du jour</h2>
    <div class="repartition" id="repartition"></div>
  </section>

  <section id="sectionListe">
    <h2>Entrées du jour</h2>
    <div id="liste"></div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var COLS = [
    { name: 'Date', title: 'Date', type: 'Date' },
    { name: 'Projet', title: 'Projet', optional: true },
    { name: 'Activité', title: 'Activité', optional: true },
    { name: 'Agent', title: 'Agent', optional: true },
    { name: 'Heures', title: 'Heures', type: 'Numeric' },
    { name: 'Commentaire', title: 'Commentaire', type: 'Text', optional: true }
  ];

  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin',
              'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

  var state = {
    entrees: [],
    mappings: null,
    colonnes: null,
    champs: {},
    preparationEnCours: false,
    erreurRefMontree: false,
    dernierFetchRefs: 0
  };

  var CLES_CHOIX = [
    { cle: 'projet', libelle: 'projet', saisie: 'projet', select: 'projetRef', datalist: 'projets' },
    { cle: 'activite', libelle: 'activité', saisie: 'activite', select: 'activiteRef', datalist: 'activites', labelId: 'labelActivite' },
    { cle: 'agent', libelle: 'agent', saisie: 'agent', select: 'agentRef', datalist: 'agents', labelId: 'labelAgent' }
  ];

  var $ = function (id) { return document.getElementById(id); };

  function montreBandeau(message) {
    var b = $('banner');
    b.textContent = message;
    b.hidden = false;
  }

  function versDate(valeur) {
    if (valeur == null) return null;
    if (valeur instanceof Date && !isNaN(valeur)) return valeur;
    if (typeof valeur === 'number') {
      return isFinite(valeur) ? new Date(valeur * 86400000) : null; // jours depuis l'époque (code 'd')
    }
    if (Array.isArray(valeur) && valeur[0] === 'd') return valeur[1];
    if (typeof valeur.toDate === 'function') return valeur.toDate(); // moment
    if (typeof valeur === 'string') {
      var d = new Date(valeur + 'T00:00:00');
      return isNaN(d) ? null : d;
    }
    return null;
  }

  function versISO(date) {
    var a = date.getFullYear();
    var m = ('0' + (date.getMonth() + 1)).slice(-2);
    var j = ('0' + date.getDate()).slice(-2);
    return a + '-' + m + '-' + j;
  }

  function versEntier(date) {
    return Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000);
  }

  function dateDepuisEntier(jours) {
    return new Date(jours * 86400000);
  }

  function formateDate(date) {
    return JOURS[date.getDay()] + ' ' + date.getDate() + ' ' + MOIS[date.getMonth()] + ' ' + date.getFullYear();
  }

  function parseHeures(brut) {
    var s = String(brut == null ? '' : brut).trim().replace(/\s+/g, '').toLowerCase();
    if (!s) return null;
    var m = s.match(/^(\d+)[h:](\d{1,2})$/);
    if (m) {
      var mn = parseInt(m[2], 10);
      if (mn > 59) return null;
      return parseInt(m[1], 10) + mn / 60;
    }
    m = s.match(/^(\d+)[h:]?$/);
    if (m) return parseInt(m[1], 10);
    m = s.match(/^(\d+)(?:m|mn|min)$/);
    if (m) return parseInt(m[1], 10) / 60;
    m = s.match(/^(\d+)[.,](\d+)$/);
    if (m) return parseFloat(m[1] + '.' + m[2]);
    return null;
  }

  function formateHeures(h) {
    var minutes = Math.round(h * 60);
    var hh = Math.floor(minutes / 60);
    var mn = minutes % 60;
    if (hh === 0) return mn + ' min';
    if (mn === 0) return hh + ' h';
    return hh + ' h ' + ('0' + mn).slice(-2);
  }

  function nomsColonnes(mapping) {
    function nom(k) {
      var v = mapping ? mapping[k] : null;
      if (Array.isArray(v)) v = v[0];
      return v || k;
    }
    return {
      date: nom('Date'),
      projet: nom('Projet'),
      activite: nom('Activité'),
      agent: nom('Agent'),
      heures: nom('Heures'),
      commentaire: nom('Commentaire')
    };
  }

  function entreesJour(iso) {
    var noms = nomsColonnes(state.mappings);
    return state.entrees
      .map(function (r) {
        return {
          id: r.id,
          date: versDate(r[noms.date]),
          projet: labelPour('projet', r[noms.projet]),
          activite: labelPour('activite', r[noms.activite]),
          agent: labelPour('agent', r[noms.agent]),
          heures: Number(r[noms.heures]) || 0,
          commentaire: r[noms.commentaire] != null ? String(r[noms.commentaire]) : ''
        };
      })
      .filter(function (e) {
        return e.date && versISO(e.date) === iso;
      })
      .sort(function (a, b) { return a.id - b.id; });
  }

  function labelPour(cle, valeur) {
    if (valeur == null || valeur === '') return '';
    var cfg = state.champs[cle];
    if (cfg && cfg.mode === 'ref') {
      var k = String(valeur);
      if (cfg.index && (k in cfg.index)) return cfg.index[k];
      demanderRafraichissement(cle);
      return '#' + valeur;
    }
    return String(valeur);
  }

  function valeursUniques(colId) {
    var set = {};
    state.entrees.forEach(function (r) {
      var v = r[colId];
      if (v != null && v !== '') set[String(v)] = true;
    });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'fr'); });
  }

  function colonneDisponible(cle) {
    if (!state.colonnes) return true;
    var noms = nomsColonnes(state.mappings);
    return state.colonnes.some(function (c) { return c.id === noms[cle]; });
  }

  function projetsConnus() {
    if (state.champs.projet) return [];
    var noms = nomsColonnes(state.mappings);
    var set = {};
    state.entrees.forEach(function (r) {
      var p = r[noms.projet];
      if (p != null && p !== '') set[String(p)] = true;
    });
    return Object.keys(set).sort(function (a, b) {
      return a.localeCompare(b, 'fr');
    });
  }

  function majSugestions() {
    CLES_CHOIX.forEach(function (info) {
      if (state.champs[info.cle]) return;
      var dl = $(info.datalist);
      if (!dl) return;
      var noms = nomsColonnes(state.mappings);
      dl.innerHTML = '';
      valeursUniques(noms[info.cle]).forEach(function (v) {
        var o = document.createElement('option');
        o.value = v;
        dl.appendChild(o);
      });
    });
  }

  async function getSchemaColonnes(tableId) {
    try {
      var t = await grist.docApi.getAccessToken({ readOnly: true });
      var requetes = [
        t.baseUrl + '/tables/' + encodeURIComponent(tableId) + '/columns?auth=' + encodeURIComponent(t.token)
      ];
      for (var i = 0; i < requetes.length; i++) {
        try {
          var res = await fetch(requetes[i]);
          if (!res.ok) continue;
          var data = await res.json();
          if (data && data.columns) return data.columns;
        } catch (e) { /* essai suivant */ }
      }
      return null;
    } catch (e) {
      return null;
    }
  }

  function normaliserLignes(table) {
    if (Array.isArray(table)) return table.slice();
    var out = [];
    if (!table || !Array.isArray(table.id)) return out;
    var cols = Object.keys(table);
    for (var i = 0; i < table.id.length; i++) {
      var o = { id: table.id[i] };
      cols.forEach(function (c) {
        if (c !== 'id') o[c] = Array.isArray(table[c]) ? table[c][i] : null;
      });
      out.push(o);
    }
    return out;
  }

  function choisirLabelCol(lignes) {
    var preferes = ['Name', 'Nom', 'Titre', 'Projet', 'Label', 'Intitulé', 'Intitule'];
    var cols = lignes.length ? Object.keys(lignes[0]).filter(function (c) { return c !== 'id'; }) : [];
    for (var i = 0; i < preferes.length; i++) {
      if (cols.indexOf(preferes[i]) >= 0) return preferes[i];
    }
    for (var j = 0; j < cols.length; j++) {
      var c = cols[j];
      if (lignes.every(function (r) { return r[c] == null || typeof r[c] === 'string'; })) return c;
    }
    return cols.length ? cols[0] : null;
  }

  async function preparerChamps() {
    if (state.champs.projet || state.preparationEnCours) return;
    state.preparationEnCours = true;
    try {
      var noms = nomsColonnes(state.mappings);
      var tableId = await grist.getSelectedTableId();
      if (!tableId) { reessayerChamps(); return; }
      var colonnes = await getSchemaColonnes(tableId);
      if (!colonnes) { reessayerChamps(); return; }
      essaisChamps = 0;
      state.colonnes = colonnes;
      CLES_CHOIX.forEach(function (info) {
        var c = colonnes.find(function (col) { return col.id === noms[info.cle]; });
        if (!c || !c.fields || typeof c.fields.type !== 'string') return;
        var t = c.fields.type;
        if (t.indexOf('Ref:') === 0) {
          state.champs[info.cle] = {
            mode: 'ref',
            tableId: t.split(':')[1],
            select: info.select,
            libelle: info.libelle
          };
        } else if (t === 'Choice') {
          var choices = c.fields.typeOptions && Array.isArray(c.fields.typeOptions.choices)
            ? c.fields.typeOptions.choices
            : valeursUniques(noms[info.cle]);
          state.champs[info.cle] = {
            mode: 'choice',
            choices: choices,
            select: info.select,
            libelle: info.libelle
          };
        }
      });
      CLES_CHOIX.forEach(function (info) {
        if (state.champs[info.cle] && state.champs[info.cle].mode === 'ref') {
          chargerRef(info.cle);
        }
      });
      rend();
    } catch (e) {
      reessayerChamps();
    } finally {
      state.preparationEnCours = false;
    }
  }

  var essaisChamps = 0;
  function reessayerChamps() {
    if (essaisChamps < 10 && !state.champs.projet) {
      essaisChamps++;
      setTimeout(function () { preparerChamps(); }, 1000);
    }
  }

  function demanderRafraichissement(cle) {
    if (Date.now() - state.dernierFetchRefs > 5000) {
      chargerRef(cle).then(function () { rend(); });
    }
  }

  async function chargerRef(cle) {
    var cfg = state.champs[cle];
    if (!cfg || cfg.mode !== 'ref') return;
    state.dernierFetchRefs = Date.now();
    try {
      var table = await grist.docApi.fetchTable(cfg.tableId);
      cfg.lignes = normaliserLignes(table);
      cfg.labelCol = choisirLabelCol(cfg.lignes);
      construireSelect(cle);
    } catch (e) {
      if (!state.erreurRefMontree) {
        state.erreurRefMontree = true;
        montreBandeau('Impossible de lire la table « ' + cfg.tableId + ' » (champ « ' + cfg.libelle + ' ») : ' +
          (e && e.message ? e.message : e) + '. Vérifiez qu’elle existe et l’accès du widget (Accès complet).');
      }
    }
  }

  function construireSelect(cle) {
    var cfg = state.champs[cle];
    if (!cfg || cfg.mode !== 'ref') return;
    var sel = $(cfg.select);
    var index = {};
    (cfg.lignes || []).forEach(function (r) {
      var lbl = cfg.labelCol && r[cfg.labelCol] != null && r[cfg.labelCol] !== ''
        ? String(r[cfg.labelCol])
        : '#' + r.id;
      index[String(r.id)] = lbl;
    });
    cfg.index = index;
    var actuel = sel.value;
    sel.innerHTML = '';
    var vide = document.createElement('option');
    vide.value = '';
    vide.textContent = '— Choisir un ' + cfg.libelle + ' —';
    sel.appendChild(vide);
    (cfg.lignes || [])
      .map(function (r) { return { id: r.id, label: index[String(r.id)] }; })
      .sort(function (a, b) { return a.label.localeCompare(b.label, 'fr'); })
      .forEach(function (p) {
        var o = document.createElement('option');
        o.value = p.id;
        o.textContent = p.label;
        sel.appendChild(o);
      });
    if (actuel && (actuel in index)) sel.value = actuel;
  }

  function remplirChoices(cle) {
    var cfg = state.champs[cle];
    if (!cfg || cfg.mode !== 'choice') return;
    var sel = $(cfg.select);
    var actuel = sel.value;
    sel.innerHTML = '';
    var vide = document.createElement('option');
    vide.value = '';
    vide.textContent = '— Aucune «' + cfg.libelle + '» —';
    sel.appendChild(vide);
    cfg.choices.forEach(function (c) {
      var o = document.createElement('option');
      o.value = c;
      o.textContent = c;
      sel.appendChild(o);
    });
    if (actuel && cfg.choices.indexOf(actuel) >= 0) sel.value = actuel;
  }

  function majChampsSpeciaux() {
    CLES_CHOIX.forEach(function (info) {
      var input = $(info.saisie);
      var select = $(info.select);
      var cfg = state.champs[info.cle];
      var enSelect = !!cfg;
      if (info.cle !== 'projet' && !colonneDisponible(info.cle)) {
        input.style.display = 'none';
        select.style.display = 'none';
        input.required = false;
        select.required = false;
        var label = $(info.labelId);
        if (label) label.style.display = 'none';
        return;
      }
      input.style.display = enSelect ? 'none' : '';
      select.style.display = enSelect ? '' : 'none';
      input.required = info.cle === 'projet' && !enSelect;
      select.required = info.cle === 'projet' && enSelect;
      if (enSelect && cfg.mode === 'choice') remplirChoices(info.cle);
    });
  }

  function rendResume() {
    var iso = $('jourAffiche').value;
    var entrees = entreesJour(iso);
    var rep = $('repartition');
    var parProjet = {};
    entrees.forEach(function (e) {
      var nom = e.projet || '(sans projet)';
      parProjet[nom] = (parProjet[nom] || 0) + e.heures;
    });
    var noms = Object.keys(parProjet).sort(function (a, b) {
      return parProjet[b] - parProjet[a];
    });
    var max = noms.length ? Math.max.apply(null, noms.map(function (n) { return parProjet[n]; })) : 0;
    $('resume').className = noms.length ? 'visible' : '';
    rep.innerHTML = '';
    noms.forEach(function (n) {
      var ligne = document.createElement('div');
      ligne.className = 'barre-ligne';
      var lbl = document.createElement('span');
      lbl.className = 'barre-nom';
      lbl.textContent = n;
      lbl.title = n;
      var fond = document.createElement('span');
      fond.className = 'barre-fond';
      var v = document.createElement('span');
      v.className = 'barre';
      v.style.width = max ? (100 * parProjet[n] / max) + '%' : '0';
      fond.appendChild(v);
      var val = document.createElement('span');
      val.className = 'barre-valeur';
      val.textContent = formateHeures(parProjet[n]);
      ligne.appendChild(lbl);
      ligne.appendChild(fond);
      ligne.appendChild(val);
      rep.appendChild(ligne);
    });
  }

  function rendListe() {
    var iso = $('jourAffiche').value;
    var cont = $('liste');
    var entrees = entreesJour(iso);
    var total = entrees.reduce(function (s, e) { return s + e.heures; }, 0);
    var dateAffichee = dateDepuisEntier(versEntier(new Date(iso + 'T00:00:00')));
    $('totalJour').textContent = formateHeures(total);
    document.title = formateDate(dateAffichee);
    cont.innerHTML = '';
    if (!entrees.length) {
      var p = document.createElement('div');
      p.className = 'vide';
      p.textContent = 'Aucune entrée enregistrée pour ce jour.';
      cont.appendChild(p);
      return;
    }
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    ['Projet', 'Activité', 'Agent', 'Commentaire', 'Heures', ''].forEach(function (t, i) {
      var th = document.createElement('th');
      th.textContent = t;
      if (i === 4) th.className = 'heures';
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);
    var tbody = document.createElement('tbody');
    entrees.forEach(function (e) {
      var tr = document.createElement('tr');
      var c1 = document.createElement('td');
      c1.textContent = e.projet || '(sans projet)';
      var c2 = document.createElement('td');
      c2.textContent = e.activite;
      if (!e.activite) c2.style.color = 'var(--muted)';
      var c3 = document.createElement('td');
      c3.textContent = e.agent;
      if (!e.agent) c3.style.color = 'var(--muted)';
      var c4 = document.createElement('td');
      c4.textContent = e.commentaire;
      if (!e.commentaire) c4.style.color = 'var(--muted)';
      var c5 = document.createElement('td');
      c5.className = 'heures';
      c5.textContent = formateHeures(e.heures);
      var c6 = document.createElement('td');
      var btn = document.createElement('button');
      btn.className = 'btn-suppr';
      btn.title = 'Supprimer cette entrée';
      btn.textContent = '✕';
      btn.addEventListener('click', function () { supprimerEntree(e.id); });
      c6.appendChild(btn);
      tr.appendChild(c1);
      tr.appendChild(c2);
      tr.appendChild(c3);
      tr.appendChild(c4);
      tr.appendChild(c5);
      tr.appendChild(c6);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    cont.appendChild(table);
  }

  function rend() {
    rendResume();
    rendListe();
    majSugestions();
    majChampsSpeciaux();
  }

  function deplacerJours(n) {
    var iso = $('jourAffiche').value;
    var d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    $('jourAffiche').value = versISO(d);
    $('date').value = $('jourAffiche').value;
    rend();
  }

  async function enregistrer(ev) {
    ev.preventDefault();
    var noms = nomsColonnes(state.mappings);
    var date = $('date').value;
    var cfgProjet = state.champs.projet;
    var projetEnRef = !!(cfgProjet && cfgProjet.mode === 'ref');
    var projet = projetEnRef ? '' : $('projet').value.trim();
    var cfgActivite = state.champs.activite;
    var activiteEnRef = !!(cfgActivite && cfgActivite.mode === 'ref');
    var champActivite = cfgActivite ? $(cfgActivite.select) : $('activite');
    var activite = champActivite ? champActivite.value.trim() : '';
    var cfgAgent = state.champs.agent;
    var agentEnRef = !!(cfgAgent && cfgAgent.mode === 'ref');
    var champAgent = cfgAgent ? $(cfgAgent.select) : $('agent');
    var agent = champAgent ? champAgent.value.trim() : '';
    var heuresBrut = $('heures').value;
    var commentaire = $('commentaire').value.trim();
    var projetValide = projetEnRef ? !!$('projetRef').value : !!projet;
    if (!date || !projetValide || String(heuresBrut).trim() === '') {
      return;
    }
    var Q = parseHeures(heuresBrut);
    if (!(Q > 0)) {
      montreBandeau('Heures invalides. Saisissez des centi\u00e8mes d\u2019heures (ex. 1,75) ou une dur\u00e9e (ex. 1h45 / 1:45).');
      return;
    }
    var bouton = $('btnAjouter');
    bouton.disabled = true;
    try {
      var champs = {};
      champs[noms.heures] = Q;
      champs[noms.date] = date;
      champs[noms.projet] = projetEnRef ? Number($('projetRef').value) : projet;
      if (activite) {
        champs[noms.activite] = activiteEnRef ? Number($('activiteRef').value) : activite;
      }
      if (agent) {
        champs[noms.agent] = agentEnRef ? Number($('agentRef').value) : agent;
      }
      if (commentaire) champs[noms.commentaire] = commentaire;
      await grist.getTable().create({ fields: champs });
      $('heures').value = '';
      $('commentaire').value = '';
      if (champActivite) champActivite.value = '';
      if (champAgent) champAgent.value = '';
      if (projetEnRef) {
        $('projetRef').value = '';
        $('projetRef').focus();
      } else {
        $('projet').value = '';
        $('projet').focus();
      }
    } catch (err) {
      montreBandeau('Impossible d\u2019enregistrer : ' + (err && err.message ? err.message : err) +
        '. V\u00e9rifiez le niveau d\u2019acc\u00e8s du widget (Acc\u00e8s complet) et les colonnes dans le panneau de cr\u00e9ation.' +
        ' Si « Projet » est une référence, le widget doit aussi pouvoir lire la table source.');
    } finally {
      bouton.disabled = false;
    }
  }

  async function supprimerEntree(rowId) {
    if (!window.confirm('Supprimer cette entrée ?')) return;
    try {
      await grist.getTable().destroy(rowId);
    } catch (err) {
      montreBandeau('Impossible de supprimer : ' + (err && err.message ? err.message : err));
    }
  }

  try {
    grist.ready({
      requiredAccess: 'full',
      columns: COLS
    });
  } catch (e) {
    grist.ready({ requiredAccess: 'full' });
  }

  grist.onRecords(function (records, mapping) {
    state.entrees = records || [];
    state.mappings = mapping;
    if (!state.champs.projet) {
      preparerChamps();
    }
    rend();
  });

  grist.onOptions(function (options, settings) {
    if (settings && settings.accessLevel && settings.accessLevel !== 'full') {
      montreBandeau('Ce widget a besoin du niveau d\u2019acc\u00e8s \u00ab Acc\u00e8s complet \u00bb pour ajouter des lignes. Ouvrez le menu du widget puis \u00ab Autoriser l\u2019acc\u00e8s \u00bb.');
    } else {
      $('banner').hidden = true;
    }
  });

  $('jourAffiche').value = versISO(new Date());
  $('date').value = $('jourAffiche').value;
  $('jourAffiche').addEventListener('change', function () {
    $('date').value = $('jourAffiche').value;
    rend();
  });
  $('jourPrecedent').addEventListener('click', function () { deplacerJours(-1); });
  $('jourSuivant').addEventListener('click', function () { deplacerJours(1); });
  $('form').addEventListener('submit', enregistrer);
  rend();
})();
</script>
</body>
</html>
